[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydradb-hermes"
version = "1.0.0"
description = "HydraDB memory provider for Hermes Agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "HydraDB", email = "support@hydradb.com" }]
keywords = ["hydradb", "hermes", "memory", "recall", "retain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=7", "responses>=0.24"]

[project.entry-points."hermes_agent.memory_providers"]
hydradb = "hydradb_hermes:register"

[project.urls]
Homepage = "https://hydradb.com"
Repository = "https://github.com/hydra-db/hydradb-hermes"

[tool.hatch.build.targets.wheel]
packages = ["hydradb_hermes"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
